[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-yaml",
    "crates/forge-store",
    "crates/forge-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Forge Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "2.0.0"
glaucus-cst = "0.4.0"
glaucus-core = "0.4.0"
rusqlite = { version = "0.33", features = ["bundled"] }
uuid = { version = "1.11", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
similar = "3.2"
tempfile = "3.17"
assert_cmd = "2.0"
predicates = "3.1"
